
name: Build Shadow Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project ZIP
        run: |
          unzip -q ShadowQuestAndroid-source.zip -d unpacked
          cp -R unpacked/ShadowQuestAndroid/. .
          rm -rf unpacked

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Quest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
